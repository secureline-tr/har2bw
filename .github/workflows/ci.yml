name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python test_nginx.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff bandit pip-audit
      - run: ruff check --select E9,F63,F7,F82 .
      - run: bandit -ll -iii har2bw.py policy_diff.py web.py
      - run: pip-audit -r requirements.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Verify health and non-root runtime
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8501/_stcore/health
          test "$(docker compose exec -T har2bw id -u)" != 0
      - if: always()
        run: docker compose logs && docker compose down
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c 'from streamlit.testing.v1 import AppTest; a=AppTest.from_file("web.py").run(); assert not a.exception; assert a.title[0].value.startswith("HAR2BW")'
