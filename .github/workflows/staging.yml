name: BunkerWeb staging and rollback
# Release gate: runs on main and on demand (Actions > Run workflow), not on every PR commit,
# to save metered runner minutes. Run it manually on a PR branch before releasing.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic BunkerWeb 1.6.18 apply and rollback
        run: python staging/verify.py
      - name: Retain synthetic staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunkerweb-1.6.18-staging
          path: staging-results/
          retention-days: 14
