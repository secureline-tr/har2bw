[project]
name = "har2bw"
version = "1.2.1"
description = "Offline HAR inventory and reviewed default-deny BunkerWeb policy drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.54.0,<2", "pillow>=13.0.0,<14"]

[project.scripts]
har2bw = "har2bw:main"
har2bw-review = "nginx_review:main"
har2bw-diff = "policy_diff:main"
har2bw-snapshot = "bunkerweb_api:main"
har2bw-history = "history:main"
har2bw-rollback-plan = "rollback_plan:main"
har2bw-report = "reporting:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["har2bw", "nginx_review", "policy_diff", "review_bundle", "bunkerweb_api", "history", "rollback_plan", "reporting", "i18n", "auth"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".ruff_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "PIE"]
ignore = ["E701", "E702", "E731"]  # compact one-line style is used in tests and CLIs
